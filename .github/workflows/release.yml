name: release

# Tag a version to ship it:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Builds every platform, signs the bundles with the updater key, and publishes
# them to a GitHub Release together with latest.json -- which is the file the
# running app polls to discover there is a newer version.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist)'
        required: true

jobs:
  release:
    permissions:
      contents: write # to create the release and upload bundles to it
    strategy:
      fail-fast: false
      # One at a time, deliberately. Every job appends its platform to the same
      # latest.json on the same release, so running them together means one job
      # deleting that asset while another updates it -- which fails with a bare
      # "Not Found" after its own bundles have already uploaded. The release
      # then looks complete while silently missing a platform from the updater
      # manifest, so that platform installs fine and never updates again.
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive # the build embeds ui/public

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      # Ubuntu 22.04 rather than latest: the AppImage produced on a newer glibc
      # refuses to start on anything older, and this is the oldest runner Tauri
      # v2 still supports. Building on the newest available would quietly narrow
      # who can run it.
      - name: Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libxdo-dev libssl-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate icons from the shared UI package
        run: |
          python -m pip install --quiet pillow
          python scripts/make-icons.py

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing is what makes the updater trust a download. Without these
          # the bundles build fine and the update path is dead, which is a
          # failure you would not notice until you shipped a second version.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'Homelab Music __VERSION__'
          releaseBody: |
            Install with one line — see the README for what each script does.

            **macOS** (Apple Silicon or Intel; handles Gatekeeper for you)
            ```sh
            curl -fsSL https://raw.githubusercontent.com/joe-lloyd/homelab-music/main/scripts/install-macos.sh | bash
            ```

            **Linux** (AppImage)
            ```sh
            curl -fsSL https://raw.githubusercontent.com/joe-lloyd/homelab-music/main/scripts/install-linux.sh | bash
            ```

            **Windows** (PowerShell)
            ```powershell
            irm https://raw.githubusercontent.com/joe-lloyd/homelab-music/main/scripts/install-windows.ps1 | iex
            ```

            Builds are unsigned — there is no Apple Developer ID and no Windows
            code-signing certificate. The install scripts deal with what that
            means on each platform. Once installed, the app updates itself from
            the tray.
          # A DRAFT, published by the job below once every platform has
          # uploaded. Not cosmetic: `releases/latest/download/latest.json` is
          # what the app polls, and with a published release the first matrix
          # job to finish becomes "latest" carrying only its own platform. For
          # the twenty-five minutes the other three take, every Windows and
          # Linux client checking for updates got "None of the fallback
          # platforms [windows-x86_64] were found in the response platforms
          # object" -- an error that looked like a broken build and was really
          # a half-published release. A draft is not served as latest, so
          # clients keep seeing the previous version until this one is whole.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true # this is latest.json, which the app polls
          args: ${{ matrix.args }}

  # Nothing is downloadable until this runs, and it only runs if all four
  # platform jobs succeeded. One platform failing now leaves a draft to inspect
  # rather than a release advertising an update half its users cannot install.
  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release once every platform is in it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # The updater reads latest.json, so a release without one would be
          # published and silently un-updatable. Check before flipping it live.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > assets.txt
          cat assets.txt
          grep -qx 'latest.json' assets.txt
          for want in 'x64-setup.exe' 'amd64.AppImage' 'aarch64.app.tar.gz' 'x64.app.tar.gz'; do
            grep -q "$want" assets.txt || { echo "missing $want"; exit 1; }
          done
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "published $TAG"
